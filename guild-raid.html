      <header class="site-header rounded-3xl border border-cyan-400/20 bg-slate-900/80 p-6 shadow-2xl shadow-cyan-500/10">
        <div class="site-header-bar flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
          <h1 class="text-2xl font-black sm:text-3xl">Praetorians of Terra</h1>
          <button type="button" class="site-header-menu-button inline-flex items-center justify-center rounded-lg border border-slate-600/80 bg-slate-900/80 p-2 text-slate-100 md:hidden" aria-label="Toggle navigation" aria-controls="primary-nav" aria-expanded="false">
            <span class="sr-only">Toggle navigation</span>
            <span class="flex h-5 w-5 flex-col items-center justify-center gap-1.5">
              <span class="block h-0.5 w-5 rounded-full bg-current"></span>
              <span class="block h-0.5 w-5 rounded-full bg-current"></span>
              <span class="block h-0.5 w-5 rounded-full bg-current"></span>
            </span>
          </button>
        </div>
        <nav id="primary-nav" aria-label="Primary" class="site-header-nav mt-3 md:mt-0">
          <ul class="flex flex-wrap items-center gap-2 md:flex-row">
            <li>
              <a href="index.html" class="inline-flex rounded-lg border border-slate-600/80 bg-slate-900/80 px-4 py-2 text-sm font-semibold text-slate-200 transition hover:border-cyan-400/70 hover:text-white">Home</a>
            </li>
            <li>
              <a href="guild-wars.html" class="inline-flex rounded-lg border border-slate-600/80 bg-slate-900/80 px-4 py-2 text-sm font-semibold text-slate-200 transition hover:border-cyan-400/70 hover:text-white">Guild Wars</a>
            </li>
            <li>
              <a href="guild-raid.html" aria-current="page" class="inline-flex rounded-lg border border-cyan-400/70 bg-cyan-500/15 px-4 py-2 text-sm font-semibold text-cyan-200">Guild Raid</a>
            </li>
            <li data-prod-hidden>
              <a href="guild-teams.html" class="inline-flex rounded-lg border border-slate-600/80 bg-slate-900/80 px-4 py-2 text-sm font-semibold text-slate-200 transition hover:border-cyan-400/70 hover:text-white">Guild Teams</a>
            </li>
            <li>
              <a href="battle-log.html" class="inline-flex rounded-lg border border-slate-600/80 bg-slate-900/80 px-4 py-2 text-sm font-semibold text-slate-200 transition hover:border-cyan-400/70 hover:text-white">Battle Log</a>
            </li>
            <li data-prod-hidden>
              <a href="player-page.html" class="inline-flex rounded-lg border border-slate-600/80 bg-slate-900/80 px-4 py-2 text-sm font-semibold text-slate-200 transition hover:border-cyan-400/70 hover:text-white">Player Stats</a>
            </li>
          </ul>
        </nav>
      </header>

      <div class="site-scroll mt-6 flex-1 min-h-0 overflow-y-auto">
        <div class="flex flex-col gap-6 pb-6">

      <nav data-breadcrumb aria-label="Breadcrumb" class="w-full"></nav>

      <section aria-labelledby="overview-heading" class="w-full">
        <header class="flex flex-col gap-3 py-1 sm:flex-row sm:items-end sm:justify-between">
          <div>
            <h2 id="overview-heading" class="text-xl font-bold leading-tight text-cyan-100 sm:text-2xl">Guild Raid Season</h2>
            <p class="mt-1 text-sm leading-relaxed text-slate-300 sm:text-base">Pick a raid boss to review every attack made against it and how each player performed this season.</p>
          </div>
          <div class="shrink-0">
            <label for="raid-season-select" class="block text-xs font-semibold uppercase tracking-wide text-slate-400">Season</label>
            <select id="raid-season-select" class="mt-1 w-full rounded-md border border-slate-600 bg-slate-900/80 px-3 py-2 text-sm font-semibold text-slate-100 sm:w-56"></select>
          </div>
        </header>
      </section>

      <section aria-label="Season summary" class="w-full">
        <div id="raid-summary" class="grid grid-cols-2 gap-3 sm:grid-cols-3 xl:grid-cols-6"></div>
      </section>

      <main class="space-y-4">
        <div class="tab-strip flex flex-wrap border-b border-slate-700">
          <button id="raid-view-tab-bosses" type="button" data-raid-view="bosses" class="border-b-2 border-cyan-400 px-5 py-3 text-sm font-semibold text-cyan-300 transition-colors hover:text-slate-100">Raid Bosses</button>
          <button id="raid-view-tab-players" type="button" data-raid-view="players" class="border-b-2 border-transparent px-5 py-3 text-sm font-semibold text-slate-400 transition-colors hover:text-slate-100">Players</button>
        </div>

        <section id="raid-grid-view" aria-label="Raid bosses">
          <div id="raid-boss-grid" class="space-y-8"></div>
        </section>

        <section id="raid-detail-view" aria-label="Raid boss detail" hidden>
          <div id="raid-boss-detail"></div>
        </section>

        <section id="raid-players-view" aria-label="Season player stats" hidden>
          <div id="raid-season-players" class="rounded-xl border border-slate-800 bg-slate-900/70 p-2 shadow-2xl shadow-black/25"></div>
        </section>
      </main>
        </div>
      </div>
    </div>

    <script src="src/navigation.js"></script>
    <script src="src/guild-raid.js"></script>
    <script>
      const isLocalDevelopmentHost = () => {
        const host = (window.location.hostname || '').toLowerCase();
        const protocol = (window.location.protocol || '').toLowerCase();

        if (protocol === 'file:') {
          return true;
        }

        return !host
          || host === 'localhost'
          || host === '127.0.0.1'
          || host === '::1'
          || host === '[::1]'
          || host === '0.0.0.0'
          || host.endsWith('.local');
      };

      const enforceProductionVisibility = () => {
        const shouldHide = !isLocalDevelopmentHost();
        document.querySelectorAll('[data-prod-hidden]').forEach((element) => {
          element.hidden = shouldHide;
          element.style.display = shouldHide ? 'none' : '';
          if (shouldHide) {
            element.setAttribute('aria-hidden', 'true');
          } else {
            element.removeAttribute('aria-hidden');
          }
        });
      };

      document.addEventListener('DOMContentLoaded', () => {
        enforceProductionVisibility();

        const menuButtons = document.querySelectorAll('.site-header-menu-button');
        menuButtons.forEach((button) => {
          const nav = document.getElementById(button.getAttribute('aria-controls'));
          if (!nav) return;
          button.addEventListener('click', () => {
            const isOpen = nav.classList.toggle('is-open');
            button.setAttribute('aria-expanded', String(isOpen));
          });
        });
      });
    </script>
  </body>
</html>
