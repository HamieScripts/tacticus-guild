<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Praetorians of Terra - Player Stats</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="src/mobile-responsive.css" />
  </head>
  <body class="min-h-screen overflow-x-hidden bg-slate-950 text-slate-100">
    <div class="site-shell mx-auto flex min-h-screen max-w-none flex-col px-4 py-4 sm:px-6 lg:px-8">
      <header class="site-header rounded-3xl border border-cyan-400/20 bg-slate-900/80 p-6 shadow-2xl shadow-cyan-500/10">
        <div class="site-header-bar flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
          <h1 class="text-2xl font-black sm:text-3xl">Praetorians of Terra</h1>
          <button type="button" class="site-header-menu-button inline-flex items-center justify-center rounded-lg border border-slate-600/80 bg-slate-900/80 p-2 text-slate-100 md:hidden" aria-label="Toggle navigation" aria-controls="primary-nav" aria-expanded="false">
            <span class="sr-only">Toggle navigation</span>
            <span class="flex h-5 w-5 flex-col items-center justify-center gap-1.5">
              <span class="block h-0.5 w-5 rounded-full bg-current"></span>
              <span class="block h-0.5 w-5 rounded-full bg-current"></span>
              <span class="block h-0.5 w-5 rounded-full bg-current"></span>
            </span>
          </button>
        </div>
        <nav id="primary-nav" aria-label="Primary" class="site-header-nav mt-3 md:mt-0">
          <ul class="flex flex-wrap items-center gap-2 md:flex-row">
            <li>
              <a href="index.html" class="inline-flex rounded-lg border border-slate-600/80 bg-slate-900/80 px-4 py-2 text-sm font-semibold text-slate-200 transition hover:border-cyan-400/70 hover:text-white">Home</a>
            </li>
            <li>
              <a href="guild-wars.html" class="inline-flex rounded-lg border border-slate-600/80 bg-slate-900/80 px-4 py-2 text-sm font-semibold text-slate-200 transition hover:border-cyan-400/70 hover:text-white">Guild Wars</a>
            </li>
            <li>
              <a href="guild-raid.html" class="inline-flex rounded-lg border border-slate-600/80 bg-slate-900/80 px-4 py-2 text-sm font-semibold text-slate-200 transition hover:border-cyan-400/70 hover:text-white">Guild Raid</a>
            </li>
            <li data-prod-hidden>
              <a href="guild-teams.html" class="inline-flex rounded-lg border border-slate-600/80 bg-slate-900/80 px-4 py-2 text-sm font-semibold text-slate-200 transition hover:border-cyan-400/70 hover:text-white">Guild Teams</a>
            </li>
            <li>
              <a href="battle-log.html" class="inline-flex rounded-lg border border-slate-600/80 bg-slate-900/80 px-4 py-2 text-sm font-semibold text-slate-200 transition hover:border-cyan-400/70 hover:text-white">Battle Log</a>
            </li>
            <li data-prod-hidden>
              <a href="player-page.html" aria-current="page" class="inline-flex rounded-lg border border-cyan-400/70 bg-cyan-500/15 px-4 py-2 text-sm font-semibold text-cyan-200">Player Stats</a>
            </li>
          </ul>
        </nav>
      </header>

      <div class="site-scroll mt-6 flex-1 min-h-0 overflow-y-auto">
        <div class="flex min-h-full flex-col gap-4 pb-2">
          <nav data-breadcrumb aria-label="Breadcrumb" class="w-full"></nav>
          <section aria-labelledby="overview-heading" class="w-full">
            <header class="py-1">
              <div class="w-full">
                <h2 id="overview-heading" class="text-xl font-bold leading-tight text-cyan-100 sm:text-2xl">Player Performance Overview</h2>
                <p id="player-page-description" class="mt-1 text-sm leading-relaxed text-slate-300 sm:text-base">Select a guild member to compare their total damage across guild raid seasons.</p>
              </div>
            </header>
          </section>

          <section class="flex min-h-0 flex-1 flex-col rounded-2xl border border-slate-800 bg-slate-900/70 p-4 shadow-2xl shadow-black/25">
            <div class="border-b border-slate-700/80" role="tablist" aria-label="Player statistics mode">
              <button id="raid-tab" type="button" role="tab" aria-selected="true" aria-controls="player-chart-panel" data-player-view="raid" class="border-b-2 border-cyan-400 px-3 py-2 text-sm font-semibold text-cyan-200">Guild Raid</button>
              <button id="war-tab" type="button" role="tab" aria-selected="false" aria-controls="player-chart-panel" data-player-view="war" class="border-b-2 border-transparent px-3 py-2 text-sm font-semibold text-slate-400 transition hover:text-slate-200">Guild War</button>
            </div>
            <div class="grid gap-4 md:grid-cols-[minmax(16rem,22rem)_minmax(18rem,24rem)_1fr] md:items-end">
              <div>
                <label for="player-select" class="block text-xs font-semibold uppercase tracking-wide text-slate-400">Player</label>
                <select id="player-select" class="mt-1 w-full rounded-lg border border-slate-500/50 bg-slate-900/80 px-3 py-2 text-sm text-slate-200 outline-none transition focus:border-cyan-400/60 focus:ring-2 focus:ring-cyan-400/30"></select>
              </div>
              <div id="raid-season-range-controls" class="grid grid-cols-2 gap-2">
                <div>
                  <label for="raid-start-season" class="block text-xs font-semibold uppercase tracking-wide text-slate-400">Start season</label>
                  <input id="raid-start-season" type="number" inputmode="numeric" class="mt-1 w-full rounded-lg border border-slate-500/50 bg-slate-900/80 px-3 py-2 text-sm text-slate-200 outline-none transition focus:border-cyan-400/60 focus:ring-2 focus:ring-cyan-400/30" />
                </div>
                <div>
                  <label for="raid-end-season" class="block text-xs font-semibold uppercase tracking-wide text-slate-400">End season</label>
                  <input id="raid-end-season" type="number" inputmode="numeric" class="mt-1 w-full rounded-lg border border-slate-500/50 bg-slate-900/80 px-3 py-2 text-sm text-slate-200 outline-none transition focus:border-cyan-400/60 focus:ring-2 focus:ring-cyan-400/30" />
                </div>
              </div>
              <p id="player-chart-summary" class="text-sm text-slate-400">Loading player history...</p>
              <div id="raid-trend-filters" class="flex flex-wrap gap-2 md:col-span-3" role="group" aria-label="Raid player trend filters"></div>
            </div>

            <div id="player-chart-panel" role="tabpanel" aria-labelledby="raid-tab" class="mt-3 flex min-h-[520px] flex-1 flex-col rounded-xl border border-slate-800/90 bg-slate-950/45 p-3">
              <div class="overflow-x-auto">
                <svg id="player-chart" class="h-[clamp(520px,66vh,900px)] w-full min-w-[860px]" viewBox="0 0 1200 620" preserveAspectRatio="xMidYMid meet"></svg>
              </div>
              <div id="player-chart-legend" class="mt-3 flex flex-wrap gap-x-4 gap-y-2 border-t border-slate-800/80 pt-3" aria-label="Chart legend"></div>
            </div>
          </section>
        </div>
      </div>
    </div>

    <script src="src/navigation.js"></script>
    <script src="src/consts/tile-scores.js"></script>
    <script src="src/consts/score-splitter.js"></script>
    <script src="src/player-page.js"></script>
    <script>
      const isLocalDevelopmentHost = () => {
        const host = (window.location.hostname || '').toLowerCase();
        const protocol = (window.location.protocol || '').toLowerCase();

        if (protocol === 'file:') {
          return true;
        }

        return !host
          || host === 'localhost'
          || host === '127.0.0.1'
          || host === '::1'
          || host === '[::1]'
          || host === '0.0.0.0'
          || host.endsWith('.local');
      };

      const enforceProductionVisibility = () => {
        const shouldHide = !isLocalDevelopmentHost();
        document.querySelectorAll('[data-prod-hidden]').forEach((element) => {
          element.hidden = shouldHide;
          element.style.display = shouldHide ? 'none' : '';
          if (shouldHide) {
            element.setAttribute('aria-hidden', 'true');
          } else {
            element.removeAttribute('aria-hidden');
          }
        });

        if (shouldHide && /player-page\.html$/i.test(window.location.pathname)) {
          window.location.replace('index.html');
        }
      };

      document.addEventListener('DOMContentLoaded', () => {
        enforceProductionVisibility();
        bindRaidSeasonRangeControls();
        bindRaidTrendFilters();

        AppNav.renderBreadcrumb([
          { label: 'Home', href: 'index.html' },
          { label: 'Player Stats' }
        ]);

        const menuButtons = document.querySelectorAll('.site-header-menu-button');
        menuButtons.forEach((button) => {
          const nav = document.getElementById(button.getAttribute('aria-controls'));
          if (!nav) return;
          button.addEventListener('click', () => {
            const isOpen = nav.classList.toggle('is-open');
            button.setAttribute('aria-expanded', String(isOpen));
          });
        });
      });
    </script>
  </body>
</html>
