name: Sync war archives to Supabase

on:
  push:
    branches: [master]
    paths:
      - 'data/war/*.json'
      - '!data/war/current.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-war-to-supabase
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run db:import:war
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}