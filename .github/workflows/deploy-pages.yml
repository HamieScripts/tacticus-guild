name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Fetch guild raid season data
        continue-on-error: true
        env:
          GUILD_RAID_API_KEY: ${{ secrets.GUILD_RAID_API_KEY }}
        run: npm run fetch:raid

      - name: Exclude war backups from Pages
        run: |
          find data/war -maxdepth 1 -type f ! -name current.json -delete
          rm -f data/dataset-manifest.json data/dataset-manifest.hash

      - name: Remove build dependencies
        run: rm -rf node_modules

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5