name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Generate dataset manifest
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          npm run generate:datasets
          echo "Published manifest cache hash: $(cat data/dataset-manifest.hash)"
          echo "War list:"
          node -e "const manifest=require('./data/dataset-manifest.json'); console.log(manifest.datasets.map((d) => d.label).join('\n'));"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4