<header
  class="rounded-3xl border border-cyan-400/20 bg-slate-900/80 p-6 shadow-2xl shadow-cyan-500/10"
>
  <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
    <h1 class="text-2xl font-black sm:text-3xl">{{ title() }}</h1>

    <div class="flex items-center gap-3">
      @if (user(); as currentUser) {
        <div class="hidden items-center gap-2 sm:flex">
          @if (currentUser.photoURL) {
            <img
              [src]="currentUser.photoURL"
              alt=""
              class="h-8 w-8 rounded-full border border-cyan-400/30"
              referrerpolicy="no-referrer"
            />
          }
          <span class="text-sm text-slate-300">{{ currentUser.displayName }}</span>
        </div>
        <button
          type="button"
          class="rounded-lg border border-slate-600/80 bg-slate-900/80 px-3 py-2 text-sm font-semibold text-slate-200 transition hover:border-cyan-400/70 hover:text-white"
          (click)="signOut.emit()"
        >
          Sign out
        </button>
      } @else {
        <button
          type="button"
          class="rounded-lg border border-slate-600/80 bg-slate-900/80 px-3 py-2 text-sm font-semibold text-slate-200 transition hover:border-cyan-400/70 hover:text-white"
          (click)="signIn.emit()"
        >
          Sign in
        </button>
      }

      <button
        type="button"
        class="inline-flex items-center justify-center rounded-lg border border-slate-600/80 bg-slate-900/80 p-2 text-slate-100 md:hidden"
        aria-controls="mobile-nav"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
      >
        <span class="sr-only">Toggle navigation</span>
        <span class="flex h-5 w-5 flex-col items-center justify-center gap-1.5" aria-hidden="true">
          <span class="block h-0.5 w-5 rounded-full bg-current"></span>
          <span class="block h-0.5 w-5 rounded-full bg-current"></span>
          <span class="block h-0.5 w-5 rounded-full bg-current"></span>
        </span>
      </button>
    </div>
  </div>

  <nav aria-label="Primary" class="mt-3 hidden md:mt-4 md:block">
    <ul class="flex flex-wrap items-center gap-2">
      @for (link of links(); track link.route) {
        <li>
          <a
            [routerLink]="link.route"
            routerLinkActive="border-cyan-400/70 bg-cyan-500/15 text-cyan-200"
            [routerLinkActiveOptions]="{ exact: link.route === '/' }"
            class="inline-flex rounded-lg border border-slate-600/80 bg-slate-900/80 px-4 py-2 text-sm font-semibold text-slate-200 transition hover:border-cyan-400/70 hover:text-white"
          >
            {{ link.label }}
          </a>
        </li>
      }
    </ul>
  </nav>
</header>

<app-mobile-nav [links]="links()" [open]="menuOpen()" (dismissed)="menuOpen.set(false)" />
