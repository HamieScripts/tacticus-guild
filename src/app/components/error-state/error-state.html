<div
  role="alert"
  class="rounded-2xl border border-rose-400/30 bg-rose-500/10 p-6 text-center"
>
  <p class="text-sm text-rose-200">{{ message() }}</p>
  <button
    type="button"
    class="mt-4 rounded-lg border border-rose-400/50 px-4 py-2 text-sm font-semibold text-rose-100 transition hover:bg-rose-500/20"
    (click)="retry.emit()"
  >
    {{ retryLabel() }}
  </button>
</div>
