<label
  for="dataset-select"
  class="block text-xs font-semibold uppercase tracking-wide text-slate-400"
>
  Dataset
</label>
<select
  id="dataset-select"
  class="mt-1 w-full rounded-lg border border-slate-500/50 bg-slate-900/80 px-3 py-2 text-sm text-slate-200 outline-none transition focus:border-cyan-400/60 focus:ring-2 focus:ring-cyan-400/30"
  [value]="selectedId() ?? ''"
  (change)="onChange($event)"
>
  @for (war of wars(); track war.id) {
    <option [value]="war.id" [selected]="war.id === selectedId()">{{ war.label }}</option>
  }
</select>
