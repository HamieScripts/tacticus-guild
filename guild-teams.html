<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Praetorians of Terra - Guild Teams</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-[19px] text-slate-100">
    <div class="pointer-events-none fixed inset-0 bg-[radial-gradient(circle_at_12%_18%,rgba(251,146,60,0.16),transparent_32%),radial-gradient(circle_at_78%_10%,rgba(56,189,248,0.12),transparent_26%),radial-gradient(circle_at_60%_84%,rgba(217,70,239,0.08),transparent_28%)]"></div>
    <div class="relative z-10 mx-auto flex max-w-none flex-col gap-8 px-5 py-10 sm:px-8 lg:px-12">
      <header class="animate__animated animate__fadeInDown rounded-3xl border border-cyan-400/20 bg-slate-900/85 p-8 shadow-2xl shadow-cyan-500/10">
        <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
          <h1 class="text-4xl font-black sm:text-5xl">Praetorians of Terra</h1>
          <nav aria-label="Primary">
            <ul class="flex flex-wrap items-center gap-2">
              <li>
                <a href="guild-wars.html" class="inline-flex rounded-lg border border-slate-600/80 bg-slate-900/80 px-6 py-3 text-lg font-semibold text-slate-200 transition hover:border-cyan-400/70 hover:text-white">Guild Wars</a>
              </li>
              <li>
                <a href="guild-teams.html" aria-current="page" class="inline-flex rounded-lg border border-cyan-400/70 bg-cyan-500/15 px-6 py-3 text-lg font-semibold text-cyan-200">Guild Teams</a>
              </li>
            </ul>
          </nav>
        </div>
      </header>

      <main class="grid gap-4 xl:grid-cols-12">
        <section class="rounded-3xl border border-amber-300/30 bg-slate-900/70 p-8 shadow-xl shadow-amber-900/20 xl:col-span-12">
          <p class="text-xs font-semibold uppercase tracking-[0.24em] text-amber-300">Guild Teams</p>
          <h2 class="mt-3 text-5xl font-black text-amber-100 sm:text-6xl">Build Library</h2>
          <p class="mt-4 max-w-4xl text-lg text-slate-300 sm:text-xl">
            Read-only overview of suggested team builds.
          </p>
        </section>

        <section class="xl:col-span-12">
          <div class="mb-4 flex items-center gap-2">
            <button id="tab-btn-library" type="button" class="rounded-md border border-cyan-400 bg-cyan-500/15 px-3 py-1.5 text-xs font-semibold text-cyan-200">Library</button>
            <button id="tab-btn-builder" type="button" class="rounded-md border border-slate-500/50 bg-slate-900/80 px-3 py-1.5 text-xs font-semibold text-slate-300">Team Builder</button>
          </div>

          <div id="tab-panel-library">
          <div class="mb-3 flex items-center justify-between gap-3">
            <h3 class="text-3xl font-black text-slate-100">Builds</h3>
            <div class="flex items-center gap-2">
              <span class="text-xs font-semibold uppercase tracking-wide text-slate-400">Type</span>
              <div id="team-type-filter" class="flex items-center gap-2" role="radiogroup" aria-label="Build type filter">
                <button type="button" data-filter="all" aria-checked="true" role="radio" class="rounded-md border border-cyan-400 bg-cyan-500/15 px-3 py-1.5 text-xs font-semibold text-cyan-200">All</button>
                <button type="button" data-filter="att" aria-checked="false" role="radio" class="rounded-md border border-slate-500/50 bg-slate-900/80 px-3 py-1.5 text-xs font-semibold text-slate-300">Att</button>
                <button type="button" data-filter="def" aria-checked="false" role="radio" class="rounded-md border border-slate-500/50 bg-slate-900/80 px-3 py-1.5 text-xs font-semibold text-slate-300">Def</button>
                <button type="button" data-filter="hybrid" aria-checked="false" role="radio" class="rounded-md border border-slate-500/50 bg-slate-900/80 px-3 py-1.5 text-xs font-semibold text-slate-300">Hybrid</button>
              </div>
            </div>
          </div>
          <div id="teams-list" class="grid grid-cols-1 gap-4"></div>
          </div>

          <div id="tab-panel-builder" class="hidden space-y-4">
            <div class="flex items-center justify-between gap-3 rounded-2xl border border-slate-700/80 bg-slate-900/75 p-4">
              <div>
                <h4 class="text-lg font-black text-slate-100">Builder Controls</h4>
                <p class="text-sm text-slate-400">Add or remove teams, then drag units into columns.</p>
              </div>
              <button id="builder-add-team" type="button" class="rounded-md border border-cyan-400 bg-cyan-500/15 px-3 py-1.5 text-xs font-semibold text-cyan-200">Add Team</button>
            </div>

            <div class="grid gap-4 lg:grid-cols-12">
              <section class="rounded-2xl border border-slate-700/80 bg-slate-900/75 p-4 lg:col-span-4">
                <div class="mb-3 flex items-center justify-between gap-2">
                  <h4 class="text-lg font-black text-slate-100">Avatar Pool</h4>
                  <span id="builder-pool-count" class="text-xs text-slate-400">0</span>
                </div>
                <input id="builder-pool-search" type="text" placeholder="Search unit id..." class="mb-3 w-full rounded-md border border-slate-500/50 bg-slate-900/80 px-3 py-2 text-sm text-slate-200" />
                <div id="builder-pool-list" class="grid max-h-[70vh] grid-cols-3 gap-2 overflow-auto"></div>
              </section>

              <section class="rounded-2xl border border-slate-700/80 bg-slate-900/75 p-4 lg:col-span-8">
                <h4 class="mb-3 text-lg font-black text-slate-100">Build Teams (Drag and Drop)</h4>
                <div id="builder-teams-list" class="space-y-4"></div>
              </section>
            </div>

            <section class="rounded-2xl border border-slate-700/80 bg-slate-900/75 p-4">
              <div class="mb-2 flex items-center justify-between gap-2">
                <h4 class="text-lg font-black text-slate-100">JSON Output</h4>
                <button id="builder-copy-json" type="button" class="rounded-md border border-cyan-400 bg-cyan-500/15 px-3 py-1.5 text-xs font-semibold text-cyan-200">Copy JSON</button>
              </div>
              <textarea id="builder-json-output" readonly class="h-56 w-full rounded-md border border-slate-600 bg-slate-950/90 p-3 text-xs text-slate-200"></textarea>
            </section>
          </div>
        </section>
      </main>
    </div>

    <script src="src/guild-teams.js"></script>
  </body>
</html>
