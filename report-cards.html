<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Praetorians of Terra - Report Cards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="src/mobile-responsive.css" />
    <script src="src/consts/tile-scores.js"></script>
    <script src="src/consts/score-splitter.js"></script>
    <script src="src/lib/report-card-metrics.js"></script>
    <script src="src/report-cards.js" defer></script>
  </head>
  <body class="min-h-screen overflow-x-hidden bg-slate-950 text-slate-100">
    <div class="site-shell mx-auto flex min-h-screen max-w-none flex-col px-4 py-4 sm:px-6 lg:px-8">
      <header class="site-header rounded-3xl border border-cyan-400/20 bg-slate-900/80 p-6 shadow-2xl shadow-cyan-500/10">
        <div class="site-header-bar flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
          <div>
            <p class="text-xs font-bold uppercase text-cyan-300">Praetorians of Terra</p>
            <h1 class="mt-1 text-2xl font-black sm:text-3xl">Player Report Cards</h1>
          </div>
          <a href="index.html" class="inline-flex w-fit rounded-lg border border-slate-600/80 bg-slate-900/80 px-4 py-2 text-sm font-semibold text-slate-200 transition hover:border-cyan-400/70 hover:text-white">Home</a>
        </div>
      </header>

      <main class="site-scroll mt-6 flex-1 min-h-0 overflow-y-auto">
        <section aria-labelledby="report-heading" class="mb-4">
          <h2 id="report-heading" class="text-xl font-bold text-cyan-100">Recent guild performance</h2>
          <p class="mt-1 text-sm text-slate-400">Players active in the current war season, or latest completed season when none is active. Raid stats cover the six most recent seasons.</p>
          <div class="mt-3 flex flex-wrap items-center gap-x-5 gap-y-2 text-xs text-slate-400">
            <span id="report-window">Loading recent periods...</span>
            <span id="report-count" aria-live="polite"></span>
          </div>
        </section>

        <div class="mb-4 flex flex-wrap items-end gap-3">
          <label class="block w-full max-w-sm">
            <span class="block text-xs font-semibold uppercase text-slate-400">Find player</span>
            <input id="report-search" type="search" autocomplete="off" placeholder="Search name" class="mt-1 w-full rounded-lg border border-slate-600 bg-slate-900 px-3 py-2 text-sm text-slate-100 outline-none focus:border-cyan-400" />
          </label>
          <label class="block w-full max-w-xs">
            <span class="block text-xs font-semibold uppercase text-slate-400">Sort players</span>
            <select id="report-sort" class="mt-1 w-full rounded-lg border border-slate-600 bg-slate-900 px-3 py-2 text-sm text-slate-100 outline-none focus:border-cyan-400">
              <option value="name">Alphabetical</option>
              <option value="raid-rank">Guild rank (Raid)</option>
              <option value="war-rank">War rank</option>
              <option value="combined-average">Combined average</option>
              <option value="combined-rank">Combined average rank</option>
            </select>
          </label>
          <button id="report-toggle-all" type="button" role="switch" aria-label="Show all tables" aria-checked="false" class="inline-flex items-center gap-2 rounded-lg border border-slate-600 bg-slate-900 px-3 py-2 text-sm font-semibold text-slate-200 transition hover:border-cyan-400/70">
            <span id="report-toggle-track" class="relative h-5 w-9 rounded-full bg-slate-700 transition-colors">
              <span id="report-toggle-thumb" class="absolute left-0.5 top-0.5 h-4 w-4 rounded-full bg-white transition-transform"></span>
            </span>
            <span id="report-toggle-label">Show all tables</span>
          </button>
        </div>

        <p id="report-status" role="status" class="mb-3 text-sm text-slate-400">Loading player data...</p>
        <section id="report-cards" aria-label="Player report cards" class="grid gap-3 lg:grid-cols-2 2xl:grid-cols-3"></section>
      </main>
    </div>

    <script>
      const localHosts = new Set(['localhost', '127.0.0.1', '::1', '[::1]', '0.0.0.0']);
      const host = (window.location.hostname || '').toLowerCase();
      const isLocal = window.location.protocol === 'file:'
        || localHosts.has(host)
        || host.endsWith('.local');

      if (!isLocal) window.location.replace('index.html');
    </script>
  </body>
</html>
